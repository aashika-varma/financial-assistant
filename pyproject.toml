[project]
name = "financial-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "langchain (>=1.4.2,<2.0.0)",
    "langchain-openai (>=1.6.6,<2.0.0)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "playwright (>=1.63.0,<2.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pypdf (>=6.19.0,<7.0.0)",
    "feedparser (>=6.0.14,<7.0.0)",
    "tavily-python (>=0.5.0,<1.0.0)"
]

[project.scripts]
financial-assistant = "financial_assistant.cli:main"

[tool.poetry]
packages = [{include = "financial_assistant", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
